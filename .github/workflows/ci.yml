name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Runs without a Jetson, so it covers code checks only, not conversion or benchmarks.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install "numpy<2" pytest
      - name: Check Python syntax
        run: python -m compileall -q convert.py benchmark.py dp2trt examples scripts tests
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run tests
        run: python -m pytest -q tests
      - name: Check results tables match the JSON files
        run: |
          python scripts/make_results_table.py
          git diff --exit-code -- README.md results/RESULTS.md
